# The text of the UI's "?" tips: what a field, a button or a section means.
#
# The build turns this file into `Tips.scala`, so `game.roles` here is `Tips.game.roles` in the code. A key is two
# words joined by a dot, each a Scala name: the screen, then the tip. A long value can go on over several lines by
# ending each but the last with a backslash; the next line's leading spaces are dropped.
#
# `{name}` is filled in where the tip is shown -- a nickname, a role, a number. A tip may lose one, or use it more than
# once, but a new name or a changed one has to be given a value in the code too, or the build stops and says where.

# --- Matches, anywhere they are listed ---

matches.friendly = A friendly match is played for fun: it does not change either player's Elo rating or place in the \
    rankings. Every other match is rated.

# --- A character's page ---

character.record = Wins, losses and draws in the matches it has finished that were not friendly, whoever owned it for \
    them. In brackets, how many of the wins and losses came by forfeit.

# --- Rankings, and a game admin's view of a player's matches ---

rankings.players = Players are ranked by Elo rating, and by rated matches between equal ratings. Every rated match of \
    this game moves its players' ratings; a friendly one does not. A player's first rated match starts them at \
    {initialRating}.
rankings.role = Players are ranked by their Elo rating as {role}, which a rated match moves against the other \
    players' ratings in the roles they played. So a role that wins more than its players' ratings say it should is \
    rated higher than the others. A player's first rated match as {role} starts them at {initialRating}.
rankings.friendlyOrRated = Every match {nickname} has played or is playing in this game, public or not. As an admin \
    of this game, you say whether each is friendly — even once it is over, until one of its players has played \
    another match of this game since.

# --- Adding or editing a game ---

game.requiresCharacters = Whether a player needs a character of their own to offer or accept a challenge. Characters \
    are made in the game engine, which tells matchmaker once one exists.
game.characterUrl = The engine's page where a player makes a character. A player without one is sent there before \
    they can offer or accept a challenge.
game.name = The game's name as the game engine knows it. Players see the display name instead, when there is one.
game.displayName = What players see. Left blank, it is the name. Rename a game by changing this rather than the name, \
    which is what the game engine is told.
game.description = A line or two about the game, shown under its name on the game's page.
game.url = The address matchmaker calls to have the game engine create a match.
game.engineIdentity = Who the engine is, such as "boxing". Moves, results and characters reported with this game's \
    API key are taken to come from it.
game.apiKeyNew = The key the engine was deployed with, at least 24 characters. It is stored, never shown again, and \
    can be replaced here later.
game.apiKeySet = A key is set. Leave this blank to keep it, or enter a new one to replace it.
game.apiKeyMissing = No key is set, so a deployed engine will refuse every call. Enter the key the engine was \
    deployed with.
game.timeoutAction = What happens to a player who takes longer over a turn than the competition allows.
game.disable = A disabled game is taken out of the menu and every game list. Its challenges, invitations and matches \
    are left as they are. It is listed on Add a Game, where it can be enabled again.
game.seats = Whether each player takes one of the game's roles, or the game is played by any number of players with \
    no roles at all. A competition of a game without roles says how many players each match has. Such a game is \
    always played with everyone moving at once.
game.minPlayers = The fewest players one match can have, at least 1.
game.maxPlayers = The most players one match can have. Leave blank if there is no limit.
game.moveType = Whether players take turns one after another, or all move at once. A competition gives each player a \
    chess clock in the first case and a time limit per turn in the second.
game.maxTurns = How many turns a match lasts, if the game always ends after a fixed number. A competition divides a \
    round's time by it when everyone moves at once. Leave blank if it varies.

# A game's roles, and each role's fields.
game.roles = Every seat in a match names a role, so a game needs at least one. A match cannot start until every \
    required role is filled, or, for a challenge that starts itself, every required and recommended role. Optional \
    roles can always be left empty, and a recommended one counts toward a competition's pool size. A role that already \
    exists can be renamed but not removed — acceptances and played matches name it, so retire one by making it \
    optional.
game.roleName = What the game engine is sent for this seat, so it has to be the name the engine expects.
game.roleDisplayName = What players see for this seat. Left blank, it is the name.
game.roleType = Required: a match cannot start without it. Recommended: a challenge that starts itself waits for it \
    too. Optional: it can always be left empty.
game.rolePreference = In a competition where roles are chosen, the role with the highest level goes to the highest \
    seed. Leave blank for no preference.

# A game's parameters, and each parameter's fields.
game.parameters = How the game engine is configured when a match is created. A game may have none at all.
game.parameterName = What the game engine is sent for this parameter, so it has to be the name the engine expects.
game.parameterDisplayName = What players see for this parameter. Left blank, it is the name.
game.parameterValues = The values a challenger can choose between, such as "3, 5, 7". A parameter with none is not \
    offered.
game.parameterDefault = The value a new challenge starts with. It has to be one of the values; left blank, it is the \
    first.

# --- Creating or editing a competition ---

competition.format = The formats this game's admins offer, grouped by kind.
competition.playersPerMatchAtLeast = How many players each match has: at least {fewest}. Or everyone in the pool in \
    one match — then set the pool size to how many should play together.
competition.playersPerMatchBetween = How many players each match has: {fewest} to {most}. Or everyone in the pool in \
    one match — then set the pool size to how many should play together.
competition.poolSize = How many play in a pool of any stage that does not set its own size. Filled in from the format.
competition.invitational = Only players you invite may enter. You may always enter your own competition.
competition.autoRounds = Each round begins as soon as the last one ends, rather than when you start it.
competition.friendly = Its matches change nobody's rating.
competition.lateEntries = Players may enter after it has started, joining from its next stage.
competition.concurrentRounds = A round-robin pool plays all of its matches in one round, rather than each player one \
    match a round.
competition.isPublic = Anybody may see it listed, and watch its matches.
competition.chooseRoles = Every match's players choose their roles before it starts, the strongest seed first, rather \
    than being given them.
competition.live = Its matches are played in real time: the game engine runs the turns and keeps the clock, so a \
    round length is required.
competition.maxEntrants = Leave blank for no limit.
competition.autoStart = It starts by itself as soon as it has its most players.
competition.plannedStart = When you mean it to be played, shown to anyone deciding whether to enter. It does not \
    schedule or start the competition.
competition.minRating = Leave blank for no minimum.
competition.maxRating = Leave blank for no maximum.
competition.entries = How many times one player may enter.
competition.timeLimit = How long a round lasts; you may give a round started by hand another. In a game of turns each \
    player has a chess clock of an equal share of it.
competition.maxTurns = This game does not say how many turns it lasts; a round's time is divided among this many.

# --- Running a competition ---

competition.roundLength = How long this round lasts. Blank uses the competition's round length.
competition.checkRound = Ends any match of this round whose clock has run out, as a player's look at it would, and \
    forfeits any seat that ran out of time to choose its role. It runs in the background, so what it changes shows \
    when the page is next refreshed.
competition.decide = For a match that cannot be played, such as one a player never turned up to: it is called off, \
    and its seats ranked as you say. The ranks decide the competition and move nobody's rating.

# --- A game's competition formats ---

competition.formats = The formats ticked here are the ones offered when a competition of this game is created. A \
    competition already made keeps its format whatever you change here.
competition.syncFormats = Makes every game's formats the ones the code defines: adds new ones and updates changed \
    ones. A format the code no longer has is removed with its competitions if nobody has entered one, and otherwise \
    only taken off every list.
