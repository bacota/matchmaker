# The name of every button in the UI: the words on it, and, where they are not enough on their own, the name a screen
# reader says for it -- "Manage" on the button, "Manage {competition}" read out, so that a list of them can be told apart.
#
# The build turns this file into `Buttons.scala`, so `tournaments.manage` here is `Buttons.tournaments.manage` in the
# code. A key is two words joined by a dot, each a Scala name: the screen, then the button. A spoken name is the
# button's key with `Named` after it.
#
# `{name}` is filled in where the button is shown, such as a competition's name. A name may lose one, or use it more
# than once, but a new name or a changed one has to be given a value in the code too, or the build stops and says where.
#
# A button whose words come from data -- a game's name, a competition's name, a nickname -- is not here, and nor is a
# menu's glyph, such as the refresh arrow, though the name it is read out by is.

