# The caption of every form field in the UI: the words beside a box, a dropdown or a tick box that say what it is.
#
# The build turns this file into `Labels.scala`, so `game.name` here is `Labels.game.name` in the code. A key is two
# words joined by a dot, each a Scala name: the screen, then the field. Where a field also has a tip, its key here is
# the same as its key in tips.properties.
#
# `{name}` is filled in where the label is shown, such as a nickname. A label may lose one, or use it more than once,
# but a new name or a changed one has to be given a value in the code too, or the build stops and says where.
#
# A caption that comes from data -- a game's parameter, a notification's question, a competition format -- is not here.

# --- Choosing a nickname, before there is a player ---

