<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Matchmaker</title>
    <link rel="stylesheet" href="./app.css" />

    <!--
      Configuration is a separate file rather than inline, so that this page is identical in every
      environment and nothing has to be edited to deploy it.

        deployed - config.js is generated by terraform from the environment's own outputs
                   (api_endpoint, hosted_login_url, user_pool_client_id) and uploaded beside this
                   file. See terraform/modules/ui.
        locally  - cp config.local.js config.js

      Nothing in it is secret: the client id is a query parameter of the authorize URL.
    -->
    <script src="./config.js"></script>
  </head>
  <body>
    <div id="app"></div>

    <!--
      Written by `mill matchmaker.ui.fastLinkJS` (development) or `fullLinkJS` (deployment). A
      module, because the build sets ModuleKind.ESModule.
    -->
    <script type="module">
      import { main } from "./main.js";
      main();
    </script>
  </body>
</html>
