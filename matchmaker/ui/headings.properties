# The heading of every page, section, card and dialog in the UI: the words above a part of the screen that say what it is.
#
# The build turns this file into `Headings.scala`, so `account.nickname` here is `Headings.account.nickname` in the
# code. A key is two words joined by a dot, each a Scala name: the screen, then the heading.
#
# `{name}` is filled in where the heading is shown, such as a game's name. A heading may lose one, or use it more than
# once, but a new name or a changed one has to be given a value in the code too, or the build stops and says where.
#
# A heading that comes from data -- a game's name, a competition's name, a nickname, a notification's question -- is
# not here, and nor is one that heads an error, which is with the error in ../errors.properties.

