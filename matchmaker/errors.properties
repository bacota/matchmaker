# The text of every error and warning matchmaker gives: what the API answers a refused request with, what a
# competition's design is warned about, and what the UI says when something it tried did not work.
#
# The build turns this file into `ErrorText.scala`, so `game.notFound` here is `ErrorText.game.notFound` in the code,
# on the server and in the UI alike. A key is two words joined by a dot, each a Scala name: what the error is about,
# then the error. A long value can go on over several lines by ending each but the last with a backslash; the next
# line's leading spaces are dropped.
#
# `{name}` is filled in where the error is raised, such as a game's name. An error may lose one, or use it more than
# once, but a new name or a changed one has to be given a value in the code too, or the build stops and says where.
#
# No internal id goes in a message: not a match, game, player, character, tournament or participant id, and not a
# Cognito subject. Name the thing -- the game's name, a nickname -- or, where there is no name to hand, say "this
# match" or "there is no such game". An error the server raises starts in lower case and has no full stop, since the UI
# shows it as it arrives, often after words of its own; one only the UI shows is a sentence.
#
# Text a person reads that is not an error is elsewhere: captions in ui/labels.properties, tips in ui/tips.properties,
# headings in ui/headings.properties, button names in ui/buttons.properties, email in
# resources/mail/messages.properties. A message that only reaches a log, and an exception for a fault in the code itself, stays in the code.

# --- Who is asking ---

caller.unregistered = you have no player here yet; choose a nickname first
caller.notSiteAdmin = only a site admin may do that

# --- The request itself: its address, its query and its body ---

request.applyToGamesHere = applyToGames is not supported for one game's settings; it belongs to PUT /me/notifications
request.invalid = '{raw}' is not a valid {what}
request.noOwner = say whose characters with ?owner=
request.notAnId = '{raw}' is not a {what} id
request.notAnEntryId = '{raw}' is not an entry id
request.malformedBody = malformed request body
request.windowOutOfRange = that window of completed matches is out of range
request.noModel = a tournament model id is needed
request.internal = internal error
request.noIdentityHeader = missing {header} header
request.unverified = no verified identity in request
request.noSuchEndpoint = no such endpoint
request.methodNotAllowed = method not allowed
request.noBody = no response body

# --- Games and their settings ---

game.notFound = there is no such game
game.notItsAdmin = only an admin of {game} may do that
game.shortApiKey = an API key must be at least {least} characters; this one is {length}
game.apiKeyTaken = that API key is another game's; every game needs a key of its own
game.unknownRoles = game '{game}' has no such role
game.rolesPlayed = role(s) {roles} cannot be deleted from game '{game}': past matches name them. Make a role optional instead.
game.rolesNotOptional = game '{game}' can do without roles only once every role is optional; {roles} are not
game.rolesInPlay = game '{game}' cannot do without its roles while a competition of it is open or under way
game.rolesAndPlayers = game '{game}' has roles and a number of players; a game without roles has the number instead
game.mostButNoFewest = game '{game}' has a most players but no fewest
game.noPlayers = game '{game}' needs at least one player a match
game.mostBelowFewest = game '{game}' has fewer most players than fewest
game.rolelessTakesTurns = game '{game}' has no roles, so its players must move at once
game.blankName = a game needs a name
game.noEngineIdentity = game '{game}' names no engine identity; it is the name the engine's API key is filed under
game.unnamedRole = game '{game}' has a role with no name
game.sameRoleName = game '{game}' has two roles with the same name
game.sameRoleDisplayName = game '{game}' shows two roles under the same name
game.unnamedParameter = game '{game}' has a parameter with no name
game.sameParameterName = game '{game}' has two parameters with the same name
game.sameParameterDisplayName = game '{game}' shows two parameters under the same name
game.repeatedValue = parameter '{parameter}' lists the same value twice
game.defaultNotAValue = parameter '{parameter}' has default '{default}', which is not one of its values

# --- A game's admins ---

gameAdmin.grantNotAllowed = only an admin, or an admin of this game, may make a player its admin
gameAdmin.notAnAdmin = that player is not an admin of this game
gameAdmin.revokeNotAllowed = only an admin, or the admin of this game who made this one, may take it away

# --- A game engine calling in ---

engine.sharedIdentity = more than one game shares this engine's identity, so which one is meant cannot be told
engine.notThisGames = this engine is not this game's

# --- Players ---

player.blankNickname = nickname must not be blank
player.nicknameTaken = nickname '{nickname}' is already taken
player.notFound = there is no such player
player.noneCalled = no player is called '{nickname}'

# --- Registering a player ---

registration.blankExternalId = externalId must not be blank
registration.taken = nickname '{nickname}' is already taken, or you already have a player

# --- A player's email address ---

email.reportedSpam = This address reported our mail as spam, so we cannot start sending to it again.
email.notAnAddress = '{address}' is not an email address
email.unverified = your sign-in carries no verified email address to record
email.complaintHeading = We have stopped emailing you.
email.complaintDetail = Mail to {address} was reported as spam, so we are no longer sending to it. If that was not deliberate, change your \
    email address above — we will start again at the new one.
email.bounceHeading = Your email is bouncing.
email.bounceDetail = Mail to {address} is not being delivered, so we have stopped sending it. Fix the mailbox and try again, or change \
    your address above.

# --- Searching ---

search.blankPrefix = search prefix must not be blank

