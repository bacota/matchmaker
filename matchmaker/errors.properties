round.resultIn = this match's result is in, and stands
round.notStarted = this tournament has not started
round.noSuchMatch = that match is not in a round of this tournament

# --- A competition's design: its problems, and its warnings ---

design.emptyPool = a pool must hold at least one participant
design.noRequiredRole = the game has no required role, so no match could start
design.matchTooSmall = a match of {players} players is fewer than the game's least of {least}
design.matchTooBig = a match of {players} players is more than the game's most of {most}
design.needsMaxTurns = this game's players move at once and it has no maximum number of turns, so the competition must give one
design.tooDeep = designs may nest at most {depth} deep
design.noStages = a design needs at least one stage
design.nestedStages = a design played in a stage's pools may have only one stage
design.stage = stage {number}
design.poolsOf = {stage}'s pools
design.neverPlayed = a stage must be played at least once
design.noneLeft = a stage must stop with at least one participant left
design.demoteTooLow = demote must be greater than 1
design.promoteTooLow = promote must be at least 1
design.promoteBelowDemote = promote must be a better rank than demote
design.strataCrossed = the minimum stratum cannot be above the maximum
design.negativePoints = points cannot be negative
design.bracketsAllAdvance = with brackets, fewer than the pool size ({pool}) must advance; demote is {demote}
design.bracketsUneven = with brackets, the number advancing ({advancing}) must divide the pool size ({pool})
design.tooManyMatches = a pool of {pool} would play {matches} matches; the most a pool may play is {most}
design.poolBelowPlayers = a pool of {pool} is fewer than the game's least of {least} players, so it could never play a match
design.poolBelowRoles = a pool of {pool} cannot fill the game's {roles} required roles, so it could never play a match
design.poolAboveMost = each pool plays as one match, and a pool of {pool} is more than the game's most of {most}
design.settingsIgnored = points, rotation and concurrent rounds are set, but this stage's pools play a design, which ranks them
design.rubberInapplicable = a rubber match only breaks ties in a game of two seats a match; scores will be used instead
design.bracketsNeedWinnerSeed = brackets keep their shape only when the winner takes the seed

