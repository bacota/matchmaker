round.checkNotOwner = only the tournament's owner may check a round
round.notUnderWay = this tournament is not under way
round.justChecked = this round was checked moments ago; its matches are still being looked at
round.stopNotOwner = only the tournament's owner may stop it
round.alreadyStopped = this tournament has been stopped already
round.alreadyOver = this tournament is already over
round.decideNotOwner = only the tournament's owner may decide a match
round.badRanks = give every seat of the match a rank of 1 or more, and no one else
