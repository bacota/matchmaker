# What matchmaker's notification emails say.
#
# Every word a player reads in an email is here, and nowhere else. The Scala side decides *which*
# of these to use -- that is a decision about who is being told what, and it is tested -- but it
# holds no prose of its own, so wording can be corrected, softened or translated without touching
# the code that sends it.
#
# The rules of the file:
#
#   * ${name} is a variable, filled in by whatever is sending the mail. Plain names only: there
#     are no expressions, no conditionals and no formatting directives here, because a template
#     language is a second program and this one would be a program nobody could test. Anything
#     that needs deciding is decided in Scala, which then picks the key it has decided on.
#   * A variable may be filled with the empty string, which is how an optional clause disappears
#     -- see ${quoted} and ${role} below. A variable that is not supplied at all is a mistake and
#     `MailTemplates` refuses to render it, rather than mailing somebody the word "${actor}".
#   * A key that is used per recipient is rendered once per recipient: ${due} is one player's
#     deadline and ${role} is one player's part, so the same event produces a different sentence
#     for each of them.
#   * \n is a line break. A value can be continued onto the next line with a trailing backslash,
#     and leading whitespace on the continuation is dropped -- so a value that must *begin* with a
#     space writes it as "\ " (see mail.quoted).
#   * Java properties files are read here as UTF-8, so an em dash is an em dash.

# --------------------------------------------------------------------------------------------
# The shape of every mail: who it is to, what it says, where to go about it.
# --------------------------------------------------------------------------------------------

# The trailing \n matters more than it looks: a body that ends without one is a last line some
# clients render against the following chrome.
mail.letter=Hello ${nickname},\n\n${body}\n\n${links}\n

# The engine's own link first when there is one: it is where the game is actually played, and
# matchmaker's home screen is a list this match is one row of. Both, because the engine's link is
# not matchmaker's to guarantee and a player who cannot use it still needs somewhere to go.
mail.links=Open matchmaker: ${uiBaseUrl}
mail.links.play=Play: ${playUrl}\nOpen matchmaker: ${uiBaseUrl}

# --------------------------------------------------------------------------------------------
# Clauses that appear inside other sentences, and are empty when there is nothing to say.
# --------------------------------------------------------------------------------------------

# The challenger's own description of their challenge, when they wrote one. Begins with a space,
# written "\ ", because it is spliced straight after a word: "your Chess challenge "best of three"".
mail.quoted=\ "${description}"

# The part a player has taken, when the news is that they took one.
mail.role=, as ${role}

# Names as a sentence: "Ada", "Ada and Grace", "Ada, Alan and Grace". ${others} is everyone but
# the last, already joined up.
mail.list.two=${first} and ${second}
mail.list.many=${others} and ${last}

# --------------------------------------------------------------------------------------------
# A challenge, to the player who offered it. They are the only one who can start it, so what they
# are told is how close it is to being startable.
# --------------------------------------------------------------------------------------------

mail.challenge.accepted.subject=${actor} has accepted your ${game} challenge
mail.challenge.accepted.body=${actor} has accepted your ${game} challenge${quoted}${role}.\n${roster}

mail.challenge.withdrawn.subject=${actor} has backed out of your ${game} challenge
mail.challenge.withdrawn.body=${actor} has backed out of your ${game} challenge${quoted}.\n${roster}

# What the challenge is still waiting for, named rather than counted: "waiting for a defender" is
# something a player can act on, where "one role left" is something they have to go and look up.
mail.challenge.roster.waiting=Still waiting for: ${roles}.
mail.challenge.roster.full=Every role is now taken.

# The one mail of the four that asks the challenger to do something.
mail.challenge.ready.subject=Your ${game} challenge is ready to start
mail.challenge.ready.body=${actor} has accepted your ${game} challenge${quoted}${role}.\n\
\n\
Every role is now taken, so you can start the match whenever you like.

# --------------------------------------------------------------------------------------------
# A challenge, to the other players who have accepted it. They cannot start it and nothing is
# being asked of them, so they are told who they will be playing with and what it waits on.
# --------------------------------------------------------------------------------------------

mail.challenge.changed.accepted.subject=${actor} has accepted a ${game} challenge you accepted
mail.challenge.changed.withdrawn.subject=${actor} has backed out of a ${game} challenge you accepted
mail.challenge.changed.accepted.event=${actor} has also accepted it${role}.
mail.challenge.changed.withdrawn.event=${actor} has backed out of it.
mail.challenge.changed.body=You have accepted ${challenger}'s ${game} challenge${quoted}.\n\
\n\
${event}\n${roster}

# Nothing for them to do, but it says who they are now waiting on, which is the honest answer to
# "when does this start?".
mail.challenge.acceptedReady.subject=A ${game} challenge you accepted is ready to start
mail.challenge.acceptedReady.body=Every role in ${challenger}'s ${game} challenge${quoted} is now taken.\n\
\n\
${challenger} offered it, so it is up to them to start the match.

# --------------------------------------------------------------------------------------------
# A match. How every mail after the first refers back to it.
# --------------------------------------------------------------------------------------------

mail.match.which=your ${game} match${quoted}

# The mail that introduces a match: what started, who is in it, whether this player is the one
# everybody is waiting for, and by when. Every later mail can assume the player knows what the
# match is, because this one told them -- which is why it announces the match where the others
# refer back to it.
mail.match.started.subject=Your ${game} match has started
mail.match.started.body=${opening}\n\n${opponents}\n${turn}
mail.match.started.opening=Your match of ${game} has started.
mail.match.started.opening.described=Your match of ${game} has started:${quoted}.
mail.match.started.opponents=Playing with you: ${others}.
mail.match.started.alone=You are the only player.
mail.match.started.turn.now=It is your turn.
mail.match.started.turn.due=It is your turn, and it is due by ${due}.
mail.match.started.turn.later=You will be told when it is your turn.

# A move, to everyone whose turn it is not: who moved and who is holding things up now, which
# between them are the only two facts a spectator of their own match can act on.
mail.match.turn.subject=${mover} has moved in your ${game} match
mail.match.turn.mover.unknown=Someone
mail.match.turn.body=${moved}\n${next}
mail.match.turn.moved=${mover} has taken a turn in ${which}.
mail.match.turn.moved.unknown=A turn has been taken in ${which}.
mail.match.turn.next=It is now ${next}'s turn.
mail.match.turn.next.unknown=Nobody is listed as being up next.

# The one notification in the whole set that asks the player to do something, so it says the
# deadline when there is one.
mail.match.yourTurn.subject=It is your turn in your ${game} match
mail.match.yourTurn.body=It is your turn in ${which}.${deadline}
mail.match.yourTurn.body.moved=${mover} has moved, and it is your turn in ${which}.${deadline}
mail.match.yourTurn.deadline=\ It is due by ${due}.

# An ending, with how it ended: the difference between the three is the whole content of the mail.
mail.match.ended.subject=Your ${game} match is over
mail.match.ended.body=${which} has ended.\n\n${how}
mail.match.ended.finished=The game is over.
mail.match.ended.cancelled=Its creator has called it off. The game board itself stays open.
mail.match.ended.forfeited=A turn ran out of time, so the match ended on a forfeit — see the result for who won.
