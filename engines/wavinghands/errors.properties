# The text of the errors and warnings the Waving Hands engine gives of its own. The rules for writing one are in
# engines/common/errors.properties, which has those every engine gives alike.
#
# The build merges this file with common's into `ErrorText.scala` in this engine's package, which the engine's code
# uses rather than common's. A key of common's given here replaces common's text in this engine, the text common's
# code gives included. It may leave out a `{name}` of common's but not add one, since common's code fills only its
# own; a key common does not have is the game's own.

wavinghands.over = this duel is already over
wavinghands.out = you are out of this duel
wavinghands.alreadyOrdered = you have already given your orders for this turn
wavinghands.notAGesture = '{gesture}' is not a gesture; expected F, P, S, W, D, C, stab or nothing
wavinghands.afraid = you are afraid, and cannot make a {gesture} with your {hand} hand
wavinghands.noTarget = that is not there to aim at
wavinghands.oneKnife = a wizard has only one knife, and cannot stab with both hands
wavinghands.selfStab = a wizard may not stab themselves
wavinghands.stabWhom = choose whom to stab
wavinghands.tooFewWizards = a duel needs at least two wizards; {sent} were sent
wavinghands.samePlayer = every wizard must belong to a different player
wavinghands.noPlace = you have no place in this duel
