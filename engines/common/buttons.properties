# The name of every button on the pages the engines serve alike, every game's included: the words on it, and, where they
# are not enough on their own, the name a screen reader says for it. A game's own pages keep their buttons in their own
# HTML, beside the rules and text around them.
#
# The build turns this file into `Buttons.scala` in engines.common, so `signIn.signIn` here is `Buttons.signIn.signIn`
# in the code. A key is two words joined by a dot, each a Scala name: the page, then the button.
#
# An engine can say one of these differently in its own buttons.properties, beside its errors.properties: the build
# merges that with this file into a `Buttons` in the engine's package, and the one here takes the engine's text in
# that engine too.

# --- Signing in to play ---

signIn.signIn = Sign in
signIn.emailCode = Email me a code instead
signIn.forgotPassword = Forgot your password?
signIn.signUp = Create an account
signIn.startAgain = Start again
signIn.saveAndSignIn = Save and sign in
signIn.tryAgain = Try again

# --- A match's end, on the play page ---

finale.close = Close
