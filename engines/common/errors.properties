# The text of every error and warning the game engines give alike: what an engine answers a refused move or request
# with, and what its pages say when something goes wrong. A game's own are in its engine's errors.properties, such as
# engines/boxing/errors.properties, which may also give a key of this file to say it differently in that game; the
# rules here are the rules there. Matchmaker's are in matchmaker/errors.properties, which the engines do not depend on.
#
# The build turns this file into `ErrorText.scala` in engines.common, so `matches.notFound` here is
# `ErrorText.matches.notFound` in the code, and merges it with each engine's into an `ErrorText` in that engine's
# package, which the engine's own code uses. A page's script is handed its text from there: a script written in Scala
# through `HtmlText.jsString`, one kept in its own `.js` file through a `const errors` object the page defines before it.
# A key is two words joined by a dot, each a Scala name: what the error is about, then the error. A long value can go on
# over several lines by ending each but the last with a backslash; the next line's leading spaces are dropped.
#
# `{name}` is filled in where the error is raised, such as a square on the board. An error may lose one, or use it more
# than once, but a new name or a changed one has to be given a value in the code too, or the build stops and says
# where. A brace that is not part of a name stops the build too, which is why a message showing JSON is handed its
# braces from the code.
#
# No internal id goes in a message: not a match or participant id, a character id, or a player's Cognito subject. Say
# "this match" or "you". An error the engine answers with starts in lower case and has no full stop, since the page
# shows it as it arrives; one only a page shows is a sentence.
#
# A message that only reaches a log, and an exception for a fault in the code itself, stays in the code.

# --- Who is playing ---

auth.signIn = sign in to play
auth.signInBecause = sign in to play: {reason}
auth.sayWho = say who you are with ?as=<cognito sub> or an X-Player-Id header

# --- A sign-in token that does not verify ---

token.malformed = malformed token
token.algorithm = unsupported token algorithm
token.noKey = token names no key
token.unknownKey = token names an unknown key
token.badSignature = bad token signature
token.otherIssuer = token is from another issuer
token.notAnIdToken = not an id token
token.otherApplication = token is for another application
token.expired = token has expired
token.noSubject = token names no subject

# --- The request itself ---

request.noMatchToWatch = say which match to watch with ?match=
request.unreadableBody = unreadable request body
request.unreadableSince = unreadable 'since': {since}
request.noSignIn = this engine has no sign-in configured
request.noRoute = no route for {method} {path}
request.noPlayLive = this engine does not offer Play Live
request.needsApiKey = this route is matchmaker's; a valid API key is required
request.failed = something went wrong in the engine; try again

# --- Matches, in every engine ---

matches.notPublic = this match is not public
matches.otherPlayers = this match already exists with other players
matches.removed = this match was created and removed
matches.notFound = there is no such match
matches.noSeat = you have no {seat} in this match
matches.over = this match is already over
matches.twoPlayers = {game} is a two-player game; {sent} player(s) were sent
matches.samePlayer = the two seats must belong to two different players
matches.changedUnderneath = this match changed underneath this update

# --- A live match's clock ---

clock.unknownKind = '{kind}' is not a kind of clock; expected PER_TURN or TOTAL
clock.noTimeLimit = a live match needs a time limit of at least a second; {seconds} was sent
clock.ranOut = the turn ran out before this move was made; the match is over by forfeit
clock.tenSeconds = Ten seconds left on your clock.

# --- An archived match ---

archive.expired = this was a friendly match, and its archive has expired
archive.expiredHeading = This match is no longer available
archive.expiredDetail = It was a friendly match, and friendly matches are kept for 30 days after they finish. Its record has expired.

# --- The play pages ---

page.unreachable = could not reach the engine
page.notAnswered = the engine has not answered yet; the board shows the last it heard
page.noSeat = you have no seat in this match

# --- Signing in on a play page ---

signIn.noCode = no authorization code came back
signIn.notStartedHere = this sign-in was not started here
signIn.otherTab = this sign-in was started in another tab
signIn.callbackUnreachable = the sign-in service could not be reached; check your connection and try again
signIn.notCompleted = the sign-in could not be completed: {status}
signIn.noIdToken = no id token came back
signIn.noEmail = Enter your email address.
signIn.unsupportedStep = This account needs a sign-in step this page does not support ({step}). Try resetting your password.
signIn.unreachable = Could not reach the sign-in service. Check your connection and try again.
signIn.incorrect = Incorrect email or password.
signIn.unconfirmed = This account has not been confirmed yet. Check your email for the confirmation link.
signIn.resetRequired = This account needs a new password. Use “Forgot your password?” below.
signIn.wrongCode = That code is not right. Check it and try again.
signIn.codeExpired = That code has expired. Start again to have a new one sent.
signIn.weakPassword = That password does not meet the pool's requirements: {reason}
