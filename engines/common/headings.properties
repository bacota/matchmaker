# The heading of every page or form the engines serve alike, every game's included: the words above a part of the page
# that say what it is. A game's own pages keep their headings in their own HTML, beside the rules and text around them.
#
# The build turns this file into `Headings.scala` in engines.common, so `signIn.signIn` here is
# `Headings.signIn.signIn` in the code. A key is two words joined by a dot, each a Scala name: the page, then the
# heading.
#
# A heading that heads an error is with the error, in errors.properties.

# --- Signing in to play ---

signIn.signIn = Sign In
signIn.code = Enter Your Code
signIn.newPassword = Choose a Password
