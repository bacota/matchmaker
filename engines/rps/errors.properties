# The text of the errors and warnings the rock-paper-scissors engine gives of its own. The rules for writing one are in
# engines/common/errors.properties, which has those every engine gives alike.
#
# The build merges this file with common's into `ErrorText.scala` in this engine's package, which the engine's code
# uses rather than common's. A key of common's given here replaces common's text in this engine, the text common's
# code gives included. It may leave out a `{name}` of common's but not add one, since common's code fills only its
# own; a key common does not have is the game's own.

rps.alreadyThrown = you have already thrown; a throw cannot be taken back
rps.notAThrow = '{shape}' is not a throw; expected rock, paper or scissors
