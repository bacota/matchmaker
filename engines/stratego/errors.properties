# The text of the errors and warnings the Stratego engine gives of its own. The rules for writing one are in
# engines/common/errors.properties, which has those every engine gives alike.
#
# The build merges this file with common's into `ErrorText.scala` in this engine's package, which the engine's code
# uses rather than common's. A key of common's given here replaces common's text in this engine, the text common's
# code gives included. It may leave out a `{name}` of common's but not add one, since common's code fills only its
# own; a key common does not have is the game's own.

stratego.offBoard = square {square} is not on the board; squares are numbered 0 to 99
stratego.noPiece = there is no piece on {square}
stratego.notYourPiece = the piece on {square} is not yours
stratego.immovable = a {rank} cannot move
stratego.cannotMoveThere = your {rank} cannot move from {from} to {to}
stratego.setupSize = a setup places 40 pieces, not {placed}
stratego.setupCounts = a setup has the wrong number of {counts}
stratego.setupCount = {rank} ({placed}, not {count})
stratego.alreadyDeployed = you have already deployed; a setup cannot be changed
stratego.notARank = '{rank}' is not a rank
stratego.otherNotDeployed = {side} has not deployed yet
stratego.deployFirst = deploy your army before moving
stratego.notYourTurn = it is {turn}'s turn, not {side}'s
stratego.shuttling = that would be a fourth move in a row between {from} and {to}
stratego.badMaxMoves = maxMoves must be a positive whole number, not '{raw}'
stratego.badMove = a move is {setup}, {step} or {concede}
