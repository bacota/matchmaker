# The text of the errors and warnings the boxing engine gives of its own. The rules for writing one are in
# engines/common/errors.properties, which has those every engine gives alike.
#
# The build merges this file with common's into `ErrorText.scala` in this engine's package, which the engine's code
# uses rather than common's. A key of common's given here replaces common's text in this engine, the text common's
# code gives included. It may leave out a `{name}` of common's but not add one, since common's code fills only its
# own; a key common does not have is the game's own.

boxing.statRange = {stat} must be between {least} and {most}; it was {was}
boxing.budget = a fighter is built from exactly {budget} points; these add up to {total}
boxing.negativePlan = offense, defense and power cannot be negative
boxing.workrate = a round is planned with exactly your workrate of {workrate}; these add up to {total}
boxing.giveToWhom = say who to give it to
boxing.noSuchFighter = you have no such fighter
boxing.noName = give your fighter a name
boxing.noMatchmaker = this engine has no matchmaker to keep fighters with
boxing.unregistered = matchmaker does not know you yet: sign in to matchmaker once to register, then come back
boxing.matchmakerRefused = matchmaker refused: {reason}
boxing.matchmakerUnreachable = matchmaker could not be reached; please try again
boxing.over = this bout is already over
boxing.unbuilt = this corner's fighter was never built
boxing.alreadyPlanned = you have already planned round {round}; a plan cannot be changed
boxing.twoFighters = boxing is a two-fighter game; {sent} player(s) were sent
boxing.samePlayer = the two corners must belong to two different players
boxing.noFighters = every corner needs a fighter; register boxing in matchmaker as a character game
boxing.unbuiltFighters = every fighter must be built before a bout, and these are not: {fighters}
boxing.unnamedFighter = an unnamed fighter
boxing.rounds = a bout is scheduled for {least} to {most} rounds; '{raw}' is not that
boxing.noCorner = you have no corner in this bout
boxing.fightersUnreachable = Could not reach the engine.
boxing.fightersSignIn = Sign in to see your fighters.
boxing.fightersSayWho = Say who you are with ?as=<cognito sub>.
boxing.notBuilt = Not a built fighter, so it cannot box.

# --- A request to the fighters page ---

request.notAFighterId = '{raw}' is not a fighter id
